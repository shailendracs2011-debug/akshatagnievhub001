{% extends 'erp/base.html' %}{% load static %}{% block content %}
<div class="filterbar">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
      {% for field in form %}
      <div>
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small style="color:var(--muted);font-size:10px">{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}<small style="color:red;font-size:11px">{{ error }}</small>{% endfor %}
      </div>
      {% endfor %}
    </div>
    <div style="margin-top:14px">
      <button type="submit" class="btn">Save Settings</button>
      <a class="btn" href="{% url 'erp_dashboard' %}" style="background:#718078">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
