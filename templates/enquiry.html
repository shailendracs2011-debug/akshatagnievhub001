{% extends 'base.html' %}
{% block title %}{{ t.enquiry_title }} | {{ site.business_name }}{% endblock %}
{% block content %}
<section class="wrap form-page">
  <div class="form-intro">
    <span class="eyebrow">{{ t.enquiry_title }}</span>
    <h1>{{ t.enquiry_title }}</h1>
    <p>{{ t.enquiry_sub }}</p>
  </div>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-brand" type="submit">{{ t.enquiry_submit }}</button>
  </form>
</section>
{% endblock %}
